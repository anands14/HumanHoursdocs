name: docs-tooling

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-candidate-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the candidate change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.13"
      - name: Test the candidate verifier
        run: python3 tests/test_verify_docs.py -v
      - name: Verify the candidate documents
        run: python3 scripts/verify_docs.py
